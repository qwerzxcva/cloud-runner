name: cloud-guardian
on:
  schedule:
    - cron: "40 7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone GitCode stock-system
        run: git clone --depth 1 https://gitcode.com/dufuwuxin/stock-system.git work
      - name: Run engines (daily + full B-rule)
        working-directory: work
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          pip install -q pyarrow 2>/dev/null || true
          python3 engines/cloud_daily.py
          python3 engines/cloud_engine_full.py
      - name: Commit results back to GitCode
        working-directory: work
        run: |
          git config user.name "cloud-guardian"
          git config user.email "bot@users.noreply.github.com"
          git add cloud/
          git commit -m "cloud run $(TZ=Asia/Shanghai date +%F-%H:%M) (GitHub Actions)" || echo "no changes"
          git -c credential.helper='!f() { echo username=dufuwuxin; echo password=${{ secrets.GITCODE_TOKEN }}; }; f' push origin main || echo "push failed"
      - name: Mirror result to this repo
        run: |
          mkdir -p cloud && cp -r work/cloud/* cloud/ 2>/dev/null || true
          git config user.name "cloud-guardian"
          git config user.email "bot@users.noreply.github.com"
          git add cloud/
          git commit -m "cloud snapshot $(TZ=Asia/Shanghai date +%F-%H:%M)" || echo "no changes"
          git push || true
